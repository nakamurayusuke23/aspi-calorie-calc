<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>カロリー＆PFC計算機 | ASPI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <img class="header__logo" src="aspi-logo.png" alt="ASPI" />
      <div class="header__text">
        <h1 class="header__title">カロリー＆PFC計算機</h1>
        <p class="header__sub">あなたに必要な1日のカロリーを算出します</p>
      </div>
    </header>

    <main class="layout">
      <!-- 入力エリア -->
      <section class="card card--input" aria-label="入力">
        <h2 class="card__title">入力</h2>

        <div class="field">
          <label class="field__label">性別</label>
          <div class="radio-group" role="radiogroup" aria-label="性別">
            <label class="radio"><input type="radio" name="sex" value="M" checked><span>男性</span></label>
            <label class="radio"><input type="radio" name="sex" value="F"><span>女性</span></label>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="age">年齢</label>
          <input class="input" id="age" type="number" inputmode="numeric" min="1" max="100" step="1" placeholder="例: 30">
          <span class="field__err" id="err-age"></span>
        </div>

        <div class="field">
          <label class="field__label" for="height">身長 (cm)</label>
          <input class="input" id="height" type="number" inputmode="decimal" min="100" max="220" step="0.1" placeholder="例: 170">
          <span class="field__err" id="err-height"></span>
        </div>

        <div class="field">
          <label class="field__label" for="weight">体重 (kg)</label>
          <input class="input" id="weight" type="number" inputmode="decimal" min="30" max="200" step="0.1" placeholder="例: 65.0">
          <span class="field__err" id="err-weight"></span>
        </div>

        <div class="field">
          <label class="field__label" for="activity">身体活動レベル</label>
          <select class="select" id="activity"></select>
        </div>

        <div class="field">
          <label class="field__label">目的</label>
          <div class="radio-group" role="radiogroup" aria-label="目的">
            <label class="radio"><input type="radio" name="goal" value="cut"><span>減量</span></label>
            <label class="radio"><input type="radio" name="goal" value="maintain" checked><span>維持</span></label>
            <label class="radio"><input type="radio" name="goal" value="bulk"><span>増量</span></label>
          </div>
        </div>

        <fieldset class="goal-block" id="goalBlock" hidden>
          <legend class="goal-block__legend">目標から逆算（任意）</legend>
          <p class="goal-block__hint">入力すると ±500kcal の代わりに、目標から必要な1日カロリーを逆算します。</p>
          <div class="field-row">
            <div class="field field--narrow">
              <label class="field__label" for="goalKg">目標体重変化 (kg)</label>
              <input class="input" id="goalKg" type="number" inputmode="decimal" min="0.1" max="50" step="0.1" placeholder="例: 5">
              <span class="field__err" id="err-goalKg"></span>
            </div>
            <div class="field field--narrow">
              <label class="field__label" for="goalMonths">期間 (ヶ月)</label>
              <input class="input" id="goalMonths" type="number" inputmode="decimal" min="0.25" max="24" step="0.25" placeholder="例: 3">
              <span class="field__err" id="err-goalMonths"></span>
            </div>
          </div>
        </fieldset>

        <button class="btn btn--block" id="reset" type="button">リセット</button>
      </section>

      <!-- 結果エリア -->
      <section class="card" id="result" aria-label="計算結果">
        <h2 class="card__title">結果</h2>
        <div id="goalCard"></div>
        <div id="numbers"></div>

        <div class="pfc-section">
          <h3 class="pfc-section__title">PFC 内訳</h3>
          <div id="pfc-bar"></div>
          <div id="pfc-list"></div>
        </div>

        <div id="alerts"></div>

        <div class="rationale" id="rationale"></div>
      </section>
    </main>

    <footer class="footer">
      <span class="footer__cite">© 株式会社ASPIREST — 出典: 『ニュートリションコーチ』(2025) p.74〜p.78 ・ 計算結果は提案の参考値です。</span>
    </footer>
  </div>

  <script src="calc.js"></script>
  <script src="alert.js"></script>
  <script src="ui.js"></script>
</body>
</html>
